<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style/all.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <!-- 電腦版 -->
      <nav class="container py-sm-4 py-3">
        <ul
          class="list-unstyled d-flex justify-content-between align-items-center"
        >
          <li>
            <ul class="list-unstyled d-flex align-items-center">
              <li class="me-8">
                <img src="./img/svg/logo/logo.svg" alt="品牌標誌" />
              </li>
              <li class="me-7 d-none d-sm-flex">
                <a class="py-3 fs-6 text-neutral-900 fw-medium" href="#"
                  >商品列表</a
                >
              </li>
              <li class="me-7 d-none d-sm-flex">
                <a class="py-3 fs-6 text-neutral-900 fw-medium" href="#"
                  >品牌故事</a
                >
              </li>
            </ul>
          </li>
          <li>
            <a class="p-3" href="#">
              <img src="./img/svg/icon/person.svg" alt="會員登入標誌" />
            </a>
          </li>
        </ul>
      </nav>
      <!-- 手機版 -->
      <nav class="d-sm-none">
        <ul class="list-unstyled d-flex text-center">
          <li class="flex-grow-1">
            <a class="py-3 btn-primary-200 active-1" href="">商品列表</a>
          </li>
          <li class="flex-grow-1">
            <a class="py-3 btn-primary-200" href="">品牌故事</a>
          </li>
        </ul>
      </nav>
    </header>
    <!-- main -->
    <main></main>
    <!-- footer -->
    <footer class="">
      <!-- 優惠 -->
      <section class="pt-sm-8 pt-5">
        <div
          class="py-5 bg-primary-200 d-flex gap-5 justify-content-center align-items-center"
        >
          <h2 class="fs-sm-4 fs-5 text-neutral-900 fw-bold lh-1p2">
            加入會員取得 9 折優惠
          </h2>
          <a class="btn btn-large btn-neutral-filled" href=""> 馬上註冊 </a>
        </div>
      </section>
      <section class="py-sm-10 py-6 px-3">
        <!-- 選單 -->
        <nav class="lisy-unstyled container pb-5 border-bottom">
          <ul
            class="list-unstyled d-flex justify-content-sm-between align-items-sm-center flex-sm-row flex-column"
          >
            <li class="me-8">
              <img src="./img/svg/logo/logo.svg" alt="品牌標誌" />
            </li>
            <li
              class="d-flex justify-content-sm-center align-items-sm-center flex-sm-row flex-column"
            >
              <a
                class="me-7 py-3 ps-sm-0 ps-3 fs-6 text-neutral-900 fw-medium"
                href="#"
                >商品列表</a
              >
              <a
                class="py-3 fs-6 ps-sm-0 ps-3 text-neutral-900 fw-medium"
                href="#"
                >品牌故事</a
              >
            </li>
          </ul>
        </nav>
        <!-- copyright -->
        <div class="pt-6 text-center">
          <div class="mb-1">
            <p class="fs-7 text-neutral-600 fw-normal">
              Copyright ©2025 URBNSTYLE
            </p>
          </div>
          <p class="fs-7 text-neutral-600 fw-normal">All Rights Reserved.</p>
        </div>
      </section>
    </footer>
  </body>
</html>
